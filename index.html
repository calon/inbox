<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My News Radar</title>
  <meta name="description" content="Personal RSS news radar">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white text-gray-800 antialiased">
  <header class="border-b border-gray-200">
    <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 id="site-title" class="text-2xl font-semibold tracking-tight">My News Radar</h1>
          <p id="site-description" class="mt-1 text-sm text-gray-500">Loading…</p>
        </div>
        <div id="update-info" class="text-xs text-gray-400"></div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
    <section class="mb-6">
      <div class="flex flex-col gap-3 sm:flex-row">
        <label class="sr-only" for="search">搜索新闻</label>
        <input
          id="search"
          type="search"
          placeholder="搜索标题、摘要、来源……"
          class="pure-input border border-gray-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-gray-500 focus:ring-1 focus:ring-gray-300"
        >
        <select id="category" class="pure-input border border-gray-300 bg-white px-3 py-2 text-sm">
          <option value="">全部分类</option>
        </select>
        <select id="source" class="pure-input border border-gray-300 bg-white px-3 py-2 text-sm">
          <option value="">全部来源</option>
        </select>
      </div>
    </section>

    <section id="source-health" class="mb-6 hidden">
      <details class="border border-gray-200 px-3 py-2 text-sm">
        <summary class="cursor-pointer text-gray-500">新闻源状态</summary>
        <div id="source-list" class="mt-3 divide-y divide-gray-100"></div>
      </details>
    </section>

    <section id="article-list" class="divide-y divide-gray-200"></section>

    <div id="empty" class="hidden py-16 text-center text-sm text-gray-500">
      没有找到匹配的文章。
    </div>
  </main>

  <footer class="mx-auto max-w-5xl px-4 py-8 text-xs text-gray-400 sm:px-6">
    RSS News Radar · Articles belong to their original publishers.
  </footer>

  <script src="app.js"></script>
</body>
</html>
